<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Category page option 1</title>
  <desc id="desc">A blue and teal themed cookbook category page mockup with a banner and recipe cards.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#edfdfd"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg1)"/>
  <rect x="0" y="0" width="1200" height="120" fill="#ffffff" opacity="0.7"/>
  <text x="80" y="78" font-size="24" font-family="Arial, sans-serif" font-weight="700" fill="#0f172a">Culinary Cookbook</text>
  <text x="1000" y="78" font-size="18" font-family="Arial, sans-serif" fill="#0f766e">Back to cookbook</text>

  <rect x="80" y="170" width="1040" height="190" rx="28" fill="url(#hero)"/>
  <circle cx="980" cy="265" r="100" fill="#9be7df" opacity="0.28"/>
  <rect x="130" y="220" width="200" height="90" rx="20" fill="#dffaf7" opacity="0.2"/>
  <text x="130" y="250" font-size="20" font-family="Arial, sans-serif" fill="#e6fffb" letter-spacing="2">CATEGORY</text>
  <text x="130" y="310" font-size="52" font-family="Arial, sans-serif" font-weight="700" fill="#ffffff">Breakfast</text>

  <g>
    <rect x="80" y="420" width="300" height="240" rx="22" fill="#ffffff" stroke="#dbeafe"/>
    <rect x="100" y="440" width="260" height="130" rx="18" fill="#dff7f7"/>
    <circle cx="235" cy="495" r="48" fill="#14b8a6" opacity="0.8"/>
    <path d="M200 520 L235 555 L290 485" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="110" y="610" font-size="28" font-family="Arial, sans-serif" font-weight="700" fill="#0f172a">French Toast</text>
    <text x="110" y="640" font-size="18" font-family="Arial, sans-serif" fill="#475569">Sweet • 15 min</text>
  </g>

  <g>
    <rect x="430" y="420" width="300" height="240" rx="22" fill="#ffffff" stroke="#dbeafe"/>
    <rect x="450" y="440" width="260" height="130" rx="18" fill="#dbeafe"/>
    <rect x="500" y="470" width="160" height="18" rx="9" fill="#60a5fa" opacity="0.7"/>
    <rect x="500" y="505" width="130" height="18" rx="9" fill="#7dd3fc" opacity="0.85"/>
    <rect x="500" y="540" width="175" height="18" rx="9" fill="#1d4ed8" opacity="0.5"/>
    <text x="450" y="610" font-size="28" font-family="Arial, sans-serif" font-weight="700" fill="#0f172a">Avocado Toast</text>
    <text x="450" y="640" font-size="18" font-family="Arial, sans-serif" fill="#475569">Savory • 10 min</text>
  </g>

  <g>
    <rect x="780" y="420" width="300" height="240" rx="22" fill="#ffffff" stroke="#dbeafe"/>
    <rect x="800" y="440" width="260" height="130" rx="18" fill="#ccfbf1"/>
    <path d="M840 535 C910 470, 970 470, 1030 535" stroke="#0f766e" stroke-width="16" fill="none" stroke-linecap="round"/>
    <circle cx="915" cy="500" r="28" fill="#2dd4bf"/>
    <path d="M1005 480 L1030 520 L970 548 Z" fill="#14b8a6" opacity="0.8"/>
    <text x="800" y="610" font-size="28" font-family="Arial, sans-serif" font-weight="700" fill="#0f172a">Berry Pancakes</text>
    <text x="800" y="640" font-size="18" font-family="Arial, sans-serif" fill="#475569">Baked • 20 min</text>
  </g>
