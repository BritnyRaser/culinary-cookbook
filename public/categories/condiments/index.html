<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Condiments | Culinary Cookbook</title>
  <link rel="stylesheet" href="/culinary-cookbook/style.css">
</head>
<body>
  <header class="site-header">
    <a href="https://BritnyRaser.github.io/culinary-cookbook/" class="back-link">&larr; Back to Cookbook</a>
  </header>

  
  
    
    
    
      
    
  

  

  <main class="container category-page">
    <section class="category-hero" style="background-image: url('/culinary-cookbook/images/condiments.png');">
      <div class="category-hero-copy">
        <p class="eyebrow">Category</p>
        <h1>Condiments</h1>
      </div>
    </section>

    
      <p class="empty-state">No recipes in this category yet.</p>
    
  </main>

  <script>
    (function () {
      const searchInput = document.getElementById('recipe-search');
      const tagOptions = document.getElementById('tag-options');
      const selectedTagsContainer = document.getElementById('selected-tags');
      const cards = Array.from(document.querySelectorAll('.category-card'));
      const noResults = document.getElementById('no-results');
      let selectedTags = [];

      const normalizeText = (value) => {
        const cleaned = (value || '').toString()
          .replace(/&amp;/gi, '&')
          .replace(/&/g, ' and ')
          .replace(/[_-]+/g, ' ')
          .replace(/[^a-z0-9\s]/gi, ' ')
          .toLowerCase();

        return cleaned.replace(/\s+/g, ' ').trim();
      };

      const parseTags = (value) => (value || '')
        .split(',')
        .map((tag) => normalizeText(tag))
        .filter(Boolean);

      const renderSelectedTags = () => {
        selectedTagsContainer.innerHTML = '';

        if (!selectedTags.length) {
          const emptyState = document.createElement('span');
          emptyState.className = 'tag-chip tag-chip-empty';
          emptyState.textContent = 'No tags selected';
          selectedTagsContainer.appendChild(emptyState);
          return;
        }

        selectedTags.forEach((tag) => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'tag-chip';
          chip.setAttribute('aria-label', `Remove tag ${tag}`);
          chip.innerHTML = `${tag} <span aria-hidden="true">×</span>`;
          chip.addEventListener('click', () => {
            selectedTags = selectedTags.filter((item) => item !== tag);
            renderSelectedTags();
            renderTagOptions();
            filterCards();
          });
          selectedTagsContainer.appendChild(chip);
        });
      };

      const renderTagOptions = () => {
        if (!tagOptions) return;

        const uniqueTags = new Set();
        cards.forEach((card) => {
          parseTags(card.dataset.tags).forEach((tag) => uniqueTags.add(tag));
        });

        tagOptions.innerHTML = '';
        Array.from(uniqueTags).sort().forEach((tag) => {
          const option = document.createElement('button');
          option.type = 'button';
          option.className = 'tag-option' + (selectedTags.includes(tag) ? ' selected' : '');
          option.textContent = tag;
          option.setAttribute('aria-pressed', selectedTags.includes(tag) ? 'true' : 'false');
          option.addEventListener('click', () => {
            if (selectedTags.includes(tag)) {
              selectedTags = selectedTags.filter((item) => item !== tag);
            } else {
              selectedTags = [...selectedTags, tag];
            }
            renderSelectedTags();
            renderTagOptions();
            filterCards();
          });
          tagOptions.appendChild(option);
        });
      };

      const filterCards = () => {
        const query = normalizeText(searchInput.value);
        let visibleCount = 0;

        cards.forEach((card) => {
          const nameText = normalizeText(card.dataset.name || card.querySelector('h3 a')?.textContent || '');
          const cardText = normalizeText(card.textContent || '');
          const tags = parseTags(card.dataset.tags);
          const matchesQuery = !query || nameText.includes(query) || cardText.includes(query);
          const matchesTag = selectedTags.length === 0 || selectedTags.some((tag) => tags.includes(tag));
          const shouldShow = matchesQuery && matchesTag;
          card.style.display = shouldShow ? '' : 'none';
          if (shouldShow) visibleCount += 1;
        });

        if (noResults) {
          noResults.hidden = visibleCount !== 0;
        }
      };

      if (searchInput && cards.length) {
        renderTagOptions();
        renderSelectedTags();
        searchInput.addEventListener('input', filterCards);
      }
    })();
  </script>
</body>
</html>
