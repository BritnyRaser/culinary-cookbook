<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Category concept B</title>
  <desc id="desc">A softer category concept with image backplate, flat text labels, and two filter controls above the recipe grid.</desc>
  <defs>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#effafc"/>
