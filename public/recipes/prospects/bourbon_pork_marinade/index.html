<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Bourbon Pork Marinade | Culinary Cookbook</title>
<link rel=stylesheet href=/culinary-cookbook/style.css></head><body><header class=site-header><a href=http://localhost:1313/culinary-cookbook/ class=back-link>&larr; Back to Cookbook</a><h1>Bourbon Pork Marinade</h1></header><main class="container recipe-layout"><aside class=sidebar><div class=meta-box></div><section class=ingredients-section><h2>Ingredients</h2><ul class=ingredients-list><li><label><input type=checkbox>
<span><strong>Bourbon</strong>
— 1 cup</span></label></li><li><label><input type=checkbox>
<span><strong>Brown Sugar</strong>
— 1/2 cup</span></label></li><li><label><input type=checkbox>
<span><strong>Soy Sauce</strong>
— 1/4 cup</span></label></li><li><label><input type=checkbox>
<span><strong>Worcestershire Sauce</strong>
— 1 Tablespoon</span></label></li><li><label><input type=checkbox>
<span><strong>Rosemary</strong>
— 1/2 Tablespoon</span></label></li><li><label><input type=checkbox>
<span><strong>Black Pepper</strong>
— 1 teaspoon</span></label></li></ul></section></aside><section class=directions-section><h2>Directions</h2><ol class=steps-list><li><p>Whisk or blend <mark class=ing>Bourbon</mark>, <mark class=ing>Brown Sugar</mark>, <mark class=ing>Soy Sauce</mark>, <mark class=ing>Worcestershire Sauce</mark>, chopped <mark class=ing>Rosemary</mark>, <mark class=ing>Black Pepper</mark> together until fully incorporated.</p></li><li><p>Marinate pork for up to four hours.</p></li></ol></section></main></body></html>
