name: Deploy Culinary Cookbook to GitHub Pages

# setting up the GitHub Actions workflow file. This tells GitHub how to automatically 
# compile your .cook files, build your Hugo site, and deploy the finished website to 
# GitHub Pages every time you push changes

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install CookCLI
        run: |
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/cooklang/cookcli/releases/latest | grep "browser_download_url" | grep "linux" | grep "amd64\|x86_64" | head -n 1 | cut -d '"' -f 4)
          curl -sSL "$DOWNLOAD_URL" -o cookcli.tar.gz
          tar -xzf cookcli.tar.gz
          sudo mv cook /usr/local/bin/ || sudo mv cookcli /usr/local/bin/

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Process Recipes (.cook to JSON)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Build Hugo Site
        run: |
          hugo --minify

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
