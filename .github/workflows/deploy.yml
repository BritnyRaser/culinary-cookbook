# ==============================================================================
# GitHub Actions Workflow: Culinary Cookbook Deployment
#
# Triggers: Automatically runs on pushes to 'main' or via manual dispatch.
# Build Phase:
#   1. Sets up the Ubuntu build environment and checks out repository source.
#   2. Installs Hugo static site generator.
#   3. Executes 'build.sh' to process Markdown recipes into JSON and generate content routes.
#   4. Compiles and minifies the final site into static assets ('./public').
# Deploy Phase:
#   6. Publishes compiled build artifacts directly to GitHub Pages.
# ==============================================================================

name: Deploy Culinary Cookbook to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Process Markdown Recipes
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Build Hugo Site
        run: |
          hugo --minify

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
