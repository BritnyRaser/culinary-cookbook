    <style>
      .grocery-page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      .grocery-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
      }
      .grocery-header h1 {
        margin: 0;
        color: #12354a;
        font-size: clamp(2.2rem, 4vw, 3.2rem);
      }
      .grocery-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: #edf9fb;
        color: #0f766e;
        border: 1px solid #d3ebee;
        border-radius: 999px;

      .grocery-sections { display: grid; gap: 1.5rem; }

        background: rgba(255,255,255,0.8);
        border: 1px solid #dfeef2;

        padding: 1rem 1rem 0.9rem;
        box-shadow: 0 12px 28px rgba(15,88,105,0.08);
      }
      .section-header {
        display: flex;

        margin-bottom: 0.9rem;
      }
      .section-header h2 {
        margin: 0;
        color: #0e5870;

      }
      .add-item-button {
        border: none;
        background: #0f766e;

      .edit-toggle, .save-toggle, .cancel-toggle, .undo-toggle, .remove-toggle, .add-submit, .add-cancel {

        background: #f4fbff;

        gap: 0.55rem;
        align-items: end;
        flex-wrap: wrap;
      }
      .grocery-section.is-adding .add-form { display: flex; }
      .add-form label {
        display: flex;
        flex-direction: column;
        gap: 0.28rem;

      @media (max-width: 640px) {
        .grocery-page { padding: 1.25rem 0.75rem 2.5rem; }
        .grocery-item { gap: 0.45rem; }
        .item-actions { gap: 0.25rem; }
      }
    </style>

    <section class="grocery-page">
      <header class="grocery-header">
        <h1>Grocery List</h1>
        <div class="grocery-badge">Drag to reorder</div>
      </header>

      <div class="grocery-sections">
        <section class="grocery-section">
          <div class="section-header"><h2>Ingredients</h2><button class="add-item-button" type="button">Add</button></div>
          <div class="grocery-grid" data-grid="all"></div>
          <form class="add-form" data-form="all">
            <label>Ingredient<input type="text" name="name" placeholder="e.g. Spinach" required></label>
            <label>Amount<input type="text" name="amount" placeholder="2" required></label>
            <label>Unit<select name="unit"><option value="each">each</option><option value="oz">oz</option><option value="lb">lb</option><option value="bunch">bunch</option><option value="bag">bag</option><option value="bottle">bottle</option><option value="loaf">loaf</option><option value="gal">gal</option><option value="box">box</option><option value="pack">pack</option><option value="can">can</option><option value="jar">jar</option></select></label>
            <button class="add-submit" type="submit">Add Ingredient</button>
            <button class="add-cancel" type="button">Cancel</button>
          </form>
        </section>
      </div>
    </section>

    <script>
      const STORAGE_KEY = 'groceryState_v1';
      const ORDER_STORAGE_KEY = 'groceryOrder_v1';
      const sectionOrder = ['Produce','Bakery','Meat','Pantry','Dairy','Frozen','Personal Care','Home Supplies','Miscellaneous'];
      const defaultState = {
        Produce: [{ name: 'Apples', amount: 6, unit: 'each' }, { name: 'Avocados', amount: 2, unit: 'each' }, { name: 'Bell Peppers', amount: 3, unit: 'each' }],
        Bakery: [{ name: 'Bread', amount: 1, unit: 'loaf' }],
        Meat: [], Pantry: [], Dairy: [], Frozen: [], 'Personal Care': [], 'Home Supplies': [], 'Miscellaneous': []
      };
      const groceryGrid = document.querySelector('[data-grid="all"]');

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw === null) return JSON.parse(JSON.stringify(defaultState));
          const parsed = JSON.parse(raw);
          sectionOrder.forEach((section) => {
            if (!Array.isArray(parsed[section])) parsed[section] = [];
          });
          return parsed;
        } catch (e) {
          console.warn('Failed to load grocery state:', e);
        }
        return JSON.parse(JSON.stringify(defaultState));
      }

      function loadOrder() {
        try {
          const raw = localStorage.getItem(ORDER_STORAGE_KEY);
          if (raw === null) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) throw new TypeError('Saved grocery order must be an array.');
          return parsed;
        } catch (e) {
          console.warn('Failed to load grocery order:', e);
          return [];
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(groceryState));
        } catch (e) {
          console.warn('Failed to save grocery state:', e);
        }
      }

      const groceryState = loadState();
      let groceryOrder = loadOrder();
      let itemIdsChanged = false;
      let draggedArticle = null;
      let dragPointerId = null;

      function createItemId(usedIds) {
        let id;
        do {
          id = 'grocery-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
        } while (usedIds.has(id));
        return id;
      }

      function getOrderedItems() {
        const usedIds = new Set();
        const allItems = sectionOrder.flatMap((section) => (groceryState[section] || []).map((item) => {
          if (!item._groceryId || usedIds.has(item._groceryId)) {
            item._groceryId = createItemId(usedIds);
            itemIdsChanged = true;
          }
          usedIds.add(item._groceryId);
          return { item, section };
        }));
        const itemsById = new Map(allItems.map((entry) => [entry.item._groceryId, entry]));
        const orderedItems = groceryOrder.map((id) => itemsById.get(id)).filter(Boolean);
        const orderedIds = new Set(orderedItems.map((entry) => entry.item._groceryId));
        allItems.forEach((entry) => {
          if (!orderedIds.has(entry.item._groceryId)) orderedItems.push(entry);
        });
        return orderedItems;
      }

      const formatAmount = (amount, unit) => {
        const normalizedAmount = amount == null || amount === '' ? '1' : String(amount).trim();
        const normalizedUnit = unit && unit !== 'each' ? unit : '';
        return normalizedUnit ? `${normalizedAmount} ${normalizedUnit}` : normalizedAmount;
      };

      function saveOrderFromDOM() {
        groceryOrder = Array.from(groceryGrid.querySelectorAll('.grocery-item')).map((article) => article.dataset.itemId);
        try {
          localStorage.setItem(ORDER_STORAGE_KEY, JSON.stringify(groceryOrder));
        } catch (e) {
          console.warn('Failed to save grocery order:', e);
        }
        renderSection();
      }

      function moveDraggedItem(event) {
        if (!draggedArticle || event.pointerId !== dragPointerId) return;
        const target = document.elementFromPoint(event.clientX, event.clientY)?.closest('.grocery-item');
        if (!target || target === draggedArticle || target.parentElement !== groceryGrid) return;
        const midpoint = target.getBoundingClientRect().top + target.getBoundingClientRect().height / 2;
        if (event.clientY < midpoint) {
          if (draggedArticle.nextElementSibling !== target) groceryGrid.insertBefore(draggedArticle, target);
        } else if (target.nextElementSibling !== draggedArticle) {
          groceryGrid.insertBefore(draggedArticle, target.nextElementSibling);
        }
      }

      function finishDragging(event) {
        if (!draggedArticle || event.pointerId !== dragPointerId) return;
        draggedArticle.classList.remove('is-dragging');
        draggedArticle = null;
        dragPointerId = null;
        saveOrderFromDOM();
      }

      document.addEventListener('pointermove', moveDraggedItem);
      document.addEventListener('pointerup', finishDragging);
      document.addEventListener('pointercancel', finishDragging);

      function renderSection() {
        const grid = groceryGrid;
        grid.innerHTML = '';
        const items = getOrderedItems();
        if (itemIdsChanged) {
          saveState();
          itemIdsChanged = false;
        }

        if (!items.length) {
          const empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.textContent = 'No items yet';
          grid.appendChild(empty);
          return;
        }

        items.forEach(({ item, section }) => {
          const article = document.createElement('article');
          article.className = 'grocery-item';
          article.dataset.itemId = item._groceryId;
          if (item.checked) article.classList.add('is-checked');
          article.innerHTML = `
            <button class="drag-handle" type="button" aria-label="Reorder ${item.name}" title="Drag to reorder; use arrow keys to move">⠿</button>
            <div class="item-content">
              <span class="item-name">${item.name}</span>
              <span class="item-amount">${formatAmount(item.amount, item.unit)}</span>
              <div class="edit-controls">
                <input type="text" value="${item.amount}" aria-label="Edit ${item.name} amount">
                <select aria-label="Edit ${item.name} unit">
                  <option value="each" ${item.unit === 'each' ? 'selected' : ''}>each</option>
                  <option value="oz" ${item.unit === 'oz' ? 'selected' : ''}>oz</option>
                  <option value="lb" ${item.unit === 'lb' ? 'selected' : ''}>lb</option>
                  <option value="bunch" ${item.unit === 'bunch' ? 'selected' : ''}>bunch</option>
                  <option value="bag" ${item.unit === 'bag' ? 'selected' : ''}>bag</option>
                  <option value="bottle" ${item.unit === 'bottle' ? 'selected' : ''}>bottle</option>
                  <option value="loaf" ${item.unit === 'loaf' ? 'selected' : ''}>loaf</option>
                  <option value="gal" ${item.unit === 'gal' ? 'selected' : ''}>gal</option>
                  <option value="box" ${item.unit === 'box' ? 'selected' : ''}>box</option>
                  <option value="pack" ${item.unit === 'pack' ? 'selected' : ''}>pack</option>
                  <option value="can" ${item.unit === 'can' ? 'selected' : ''}>can</option>
                  <option value="jar" ${item.unit === 'jar' ? 'selected' : ''}>jar</option>
                </select>
                <button class="save-toggle" type="button">Save</button>
                <button class="cancel-toggle" type="button">Cancel</button>
              </div>
            </div>
            <div class="item-actions">
              <button class="edit-toggle" type="button" aria-label="Edit ${item.name}">✎</button>
              <button class="remove-toggle" type="button" aria-label="Remove ${item.name}">−</button>
              <button class="check-toggle" type="button" aria-label="Check ${item.name}">✓</button>
              <button class="undo-toggle" type="button" aria-label="Undo ${item.name}">↺</button>
            </div>
          `;

          const checkToggle = article.querySelector('.check-toggle');
          const undoToggle = article.querySelector('.undo-toggle');
          const editToggle = article.querySelector('.edit-toggle');
          const cancelToggle = article.querySelector('.cancel-toggle');
          const saveToggle = article.querySelector('.save-toggle');
          const removeToggle = article.querySelector('.remove-toggle');
          const amountText = article.querySelector('.item-amount');
          const amountInput = article.querySelector('input[type="text"]');
          const unitSelect = article.querySelector('select');
          const dragHandle = article.querySelector('.drag-handle');

          dragHandle.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) return;
            event.preventDefault();
            draggedArticle = article;
            dragPointerId = event.pointerId;
            article.classList.add('is-dragging');
          });
          dragHandle.addEventListener('keydown', (event) => {
            if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
            event.preventDefault();
            const sibling = event.key === 'ArrowUp' ? article.previousElementSibling : article.nextElementSibling;
            if (!sibling || !sibling.classList.contains('grocery-item')) return;
            grid.insertBefore(article, event.key === 'ArrowUp' ? sibling : sibling.nextSibling);
            saveOrderFromDOM();
            const nextIndex = groceryOrder.indexOf(article.dataset.itemId);
            grid.querySelectorAll('.drag-handle')[nextIndex]?.focus();
          });

          checkToggle.addEventListener('click', () => {
            item.checked = !item.checked;
            if (item.checked) article.classList.add('is-checked'); else article.classList.remove('is-checked');
            saveState();
          });

          undoToggle.addEventListener('click', () => {
            item.checked = false;
            article.classList.remove('is-checked');
            saveState();
          });

          editToggle.addEventListener('click', () => {
            article.classList.add('is-editing');
            amountInput.focus();
            amountInput.select();
          });

          cancelToggle.addEventListener('click', () => {
            article.classList.remove('is-editing');
            amountInput.value = item.amount;
            unitSelect.value = item.unit || 'each';
          });

          saveToggle.addEventListener('click', () => {
            const nextAmount = (amountInput.value || '').trim();
            const nextUnit = unitSelect.value || 'each';
            if (nextAmount) {
              item.amount = nextAmount;
              item.unit = nextUnit;
              amountText.textContent = formatAmount(nextAmount, nextUnit);
              saveState();
            }
            article.classList.remove('is-editing');
          });

          removeToggle.addEventListener('click', () => {
            const sectionItems = groceryState[section];
            sectionItems.splice(sectionItems.indexOf(item), 1);
            groceryOrder = groceryOrder.filter((id) => id !== item._groceryId);
            saveState();
            try {
              localStorage.setItem(ORDER_STORAGE_KEY, JSON.stringify(groceryOrder));
            } catch (e) {
              console.warn('Failed to save grocery order:', e);
            }
            renderSection();
          });

          grid.appendChild(article);
        });
      }

      function renderAllSections() {
        renderSection();
      }

      document.querySelectorAll('.add-item-button').forEach((button) => {
        button.addEventListener('click', () => {
          const section = button.closest('.grocery-section');
          section.classList.add('is-adding');
          const input = section.querySelector('input[name="name"]');
          if (input) input.focus();
        });
      });

      document.querySelectorAll('.add-cancel').forEach((button) => {
        button.addEventListener('click', () => {
          const section = button.closest('.grocery-section');
          section.classList.remove('is-adding');
          section.querySelector('form').reset();
        });
      });

      document.querySelectorAll('.add-form').forEach((form) => {
        form.addEventListener('submit', (event) => {
          event.preventDefault();
          const formData = new FormData(form);
          const name = (formData.get('name') || '').toString().trim();
          const amount = (formData.get('amount') || '').toString().trim();
          const unit = (formData.get('unit') || 'each').toString();
          if (!name || !amount) return;

          groceryState.Miscellaneous.push({ name, amount, unit });
          saveState();
          form.reset();
          form.closest('.grocery-section').classList.remove('is-adding');
          renderSection();
        });
      });
      renderAllSections();
      renderAllSections();
    </script>
  






  <script>
    (function () {
      const searchInput = document.getElementById('recipe-search');
      const tagSearchInput = document.getElementById('tag-search');
      const tagSuggestions = document.getElementById('tag-suggestions');
      const selectedTagsContainer = document.getElementById('selected-tags');
      const filterButtons = Array.from(document.querySelectorAll('.category-filter-btn'));
      const cards = Array.from(document.querySelectorAll('.category-card'));
      const noResults = document.getElementById('no-results');
      let selectedTags = [];

      const normalizeText = (value) => {
        const cleaned = (value || '').toString()
          .replace(/&amp;/gi, '&')
          .replace(/&/g, ' and ')
          .replace(/[_-]+/g, ' ')
          .replace(/[^a-z0-9\s]/gi, ' ')
          .toLowerCase();

        return cleaned.replace(/\s+/g, ' ').trim();
      };

      const parseTags = (value) => (value || '')
        .split(',')
        .map((tag) => normalizeText(tag))
        .filter(Boolean);

      const getUniqueTags = () => {
        const uniqueTags = new Set();
        cards.forEach((card) => {
          const combinedTags = [card.dataset.tags || '', card.dataset.ingredients || ''].join(',');
          parseTags(combinedTags).forEach((tag) => uniqueTags.add(tag));
        });
        return Array.from(uniqueTags).sort();
      };

      const renderSelectedTags = () => {
        selectedTagsContainer.innerHTML = '';

        if (!selectedTags.length) {
          selectedTagsContainer.style.display = 'none';
          return;
        }

        selectedTagsContainer.style.display = 'flex';

        selectedTags.forEach((tag) => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'tag-chip';
          chip.setAttribute('aria-label', `Remove tag ${tag}`);
          chip.innerHTML = `${tag} <span aria-hidden="true">×</span>`;
          chip.addEventListener('click', () => {
            selectedTags = selectedTags.filter((item) => item !== tag);
            renderSelectedTags();
            renderSuggestions();
            syncFilterButtons();
            filterCards();
          });
          selectedTagsContainer.appendChild(chip);
        });
      };

      const syncFilterButtons = () => {
        filterButtons.forEach((button) => {
          const tag = normalizeText(button.dataset.tag || button.textContent);
          const isSelected = selectedTags.includes(tag);
          button.classList.toggle('is-selected', isSelected);
          button.setAttribute('aria-pressed', String(isSelected));
        });
      };

      const renderSuggestions = () => {
        if (!tagSearchInput || !tagSuggestions) return;
        const query = normalizeText(tagSearchInput.value);
        const tagControl = tagSearchInput.closest('.tag-search-control');

        if (!query) {
          tagSuggestions.hidden = true;
          tagSuggestions.innerHTML = '';
          if (tagControl) {
            tagControl.classList.remove('is-active');
          }
          return;
        }

        if (tagControl) {
          tagControl.classList.add('is-active');
        }

        const suggestions = getUniqueTags().filter((tag) => tag.includes(query) && !selectedTags.includes(tag));
        tagSuggestions.innerHTML = '';

        if (!suggestions.length) {
          tagSuggestions.hidden = true;
          return;
        }

        suggestions.forEach((tag) => {
          const option = document.createElement('button');
          option.type = 'button';
          option.className = 'tag-suggestion';
          option.textContent = tag;
          option.addEventListener('click', () => {
            selectedTags = [...selectedTags, tag];
            tagSearchInput.value = '';
            renderSelectedTags();
            renderSuggestions();
            syncFilterButtons();
            filterCards();
          });
          tagSuggestions.appendChild(option);
        });

        tagSuggestions.hidden = false;
      };

      const filterCards = () => {
        const query = normalizeText(searchInput.value);
        let visibleCount = 0;

        cards.forEach((card) => {
          const nameText = normalizeText(card.dataset.name || card.querySelector('h3 a')?.textContent || '');
          const cardText = normalizeText(card.textContent || '');
          const combinedTags = [card.dataset.tags || '', card.dataset.ingredients || ''].join(',');
          const tags = parseTags(combinedTags);
          const matchesQuery = !query || nameText.includes(query) || cardText.includes(query);
          const matchesTag = selectedTags.length === 0 || selectedTags.every((tag) => tags.includes(tag));
          const shouldShow = matchesQuery && matchesTag;
          card.style.display = shouldShow ? '' : 'none';
          if (shouldShow) visibleCount += 1;
        });

        if (noResults) {
          noResults.hidden = visibleCount !== 0;
        }
      };

      if (searchInput && tagSearchInput && cards.length) {
        selectedTagsContainer.style.display = 'none';
        renderSelectedTags();
        syncFilterButtons();
        const tagControl = tagSearchInput.closest('.tag-search-control');
        if (tagControl) {
          tagControl.classList.remove('is-active');
        }

        filterButtons.forEach((button) => {
          button.addEventListener('click', () => {
            const tag = normalizeText(button.dataset.tag || button.textContent);
            if (!tag) return;

            if (selectedTags.includes(tag)) {
              selectedTags = selectedTags.filter((item) => item !== tag);
            } else {
              selectedTags = [...selectedTags, tag];
            }

            renderSelectedTags();
            renderSuggestions();
            syncFilterButtons();
            filterCards();
          });
        });

        searchInput.addEventListener('input', filterCards);
        tagSearchInput.addEventListener('input', renderSuggestions);
        tagSearchInput.addEventListener('focus', () => {
          if (tagSearchInput.value.trim()) {
            renderSuggestions();
          }
        });
        document.addEventListener('click', (event) => {
          if (!event.target.closest('.tag-suggestion') && !event.target.closest('#tag-search')) {
            tagSuggestions.hidden = true;
          }
        });
      }
    })();
  </script>
  <script>
    (function () {
      const hamburger = document.querySelector('.hamburger');
      const menuPanel = document.querySelector('.menu-panel');
      const categoryButton = document.querySelector('.menu-button');
      const categorySubmenu = document.querySelector('.sub-menu');

      if (hamburger && menuPanel) {
        hamburger.addEventListener('click', () => {
          const isOpen = menuPanel.classList.toggle('open');
          hamburger.setAttribute('aria-expanded', String(isOpen));
        });

        document.addEventListener('click', (event) => {
          if (!event.target.closest('.mobile-menu')) {
            menuPanel.classList.remove('open');
            hamburger.setAttribute('aria-expanded', 'false');
          }
        });
      }

      if (categoryButton && categorySubmenu) {
        categoryButton.addEventListener('click', () => {
          const isOpen = categorySubmenu.classList.toggle('open');
          categoryButton.setAttribute('aria-expanded', String(isOpen));
        });
      }
    })();
  </script>
</body>
</html>
